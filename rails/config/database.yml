# MySQL. Versions 5.6.4 and up are supported.
#
# Local defaults match Stage 0 databases on Docker MySQL (127.0.0.1:3306).
# Production / Railway: set DATABASE_URL (mysql2://user:pass@host:port/db).
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: almacen_usse_rails_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: almacen_usse_rails_test

# Prefer DATABASE_URL in production (e.g. Railway MySQL plugin).
# Rails merges DATABASE_URL over the primary settings when the env var is set.
# Sibling Solid DBs reuse that host/user/password unless CACHE/QUEUE/CABLE_DATABASE_URL is set.
<%
  require Rails.root.join("lib/shared_production/database_url").to_s
  production_database_url = SharedProduction::DatabaseUrl.with_database(
    ENV["DATABASE_URL"],
    ENV["MYSQLDATABASE"].presence || ENV["MYSQL_DATABASE"].presence
  )
  # Railway MySQL is one database. Reuse it for Solid Cache/Queue/Cable instead
  # of sibling DB names that we cannot CREATE DATABASE for.
  cache_database_url = ENV["CACHE_DATABASE_URL"].presence || production_database_url
  queue_database_url = ENV["QUEUE_DATABASE_URL"].presence || production_database_url
  cable_database_url = ENV["CABLE_DATABASE_URL"].presence || production_database_url
%>
production:
  primary: &primary_production
    <<: *default
    database: almacen_usse_rails_production
    username: <%= ENV.fetch("DB_USERNAME") { "almacen_usse" } %>
    password: <%= ENV["ALMACEN_USSE_DATABASE_PASSWORD"] %>
    <% if production_database_url %>
    url: <%= production_database_url.to_json %>
    <% end %>
  cache:
    <<: *primary_production
    database: almacen_usse_rails_production_cache
    migrations_paths: db/cache_migrate
    <% if cache_database_url %>
    url: <%= cache_database_url.to_json %>
    <% end %>
  queue:
    <<: *primary_production
    database: almacen_usse_rails_production_queue
    migrations_paths: db/queue_migrate
    <% if queue_database_url %>
    url: <%= queue_database_url.to_json %>
    <% end %>
  cable:
    <<: *primary_production
    database: almacen_usse_rails_production_cable
    migrations_paths: db/cable_migrate
    <% if cable_database_url %>
    url: <%= cable_database_url.to_json %>
    <% end %>
