# Used when the Railway service Root Directory is `rails`.
# New Railway projects may ignore this file; set the same values in the dashboard
# (see docs/deploy-railway.md). Do not add a startCommand — the Dockerfile CMD
# (./bin/thrust ./bin/rails server) must keep listening on port 80.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
