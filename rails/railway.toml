# Used when the Railway service Root Directory is `rails`.
# New Railway projects may ignore this file; set the same values in the dashboard
# (see docs/deploy-railway.md).
#
# Do not set startCommand and do not force target port 80. The image CMD
# (./bin/docker-start) binds Puma to Railway's PORT so /up is reachable.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
